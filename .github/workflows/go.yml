name: Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Добавляем fetch-depth: 0 для корректной работы SonarCloud
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Download dependencies
      run: go mod download

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: latest
        args: --timeout=5m

    - name: Build
      run: go build ./...

    # 2. Тесты должны генерировать покрытие (у тебя это уже есть)
    - name: Test
      run: go test ./... -v -coverprofile=coverage.out

    # 3. ДОБАВЛЯЕМ ШАГ SONARCLOUD
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.go.coverage.reportPaths=coverage.out